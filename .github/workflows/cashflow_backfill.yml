name: 현금흐름 과거 백필

# 주요계정 API에는 현금흐름표가 없어 backfill.py가 과거 CF를 못 채운다.
# fnlttSinglAcntAll을 회사별로 호출하는 fetch_cashflow.py를 연간 전용으로 돌려
# 과거 연도 영업활동현금흐름·유형자산 취득을 채운다. 증분이라 중단돼도 다음 실행이 이어받는다.

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: '시작 연도 (예: 2016)'
        required: true
        default: '2016'
      end_year:
        description: '종료 연도 (예: 2020) — DART 일일 쿼터상 한 번에 3~5년 권장'
        required: true
        default: '2020'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 현금흐름 연간 백필
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CF_MAX_MINUTES: '300'   # 앞단 재무 수집이 없는 전용 실행이라 6h 예산을 더 쓴다
          CF_MAX_CALLS: '19000'
        run: |
          python scripts/fetch_cashflow.py \
            ${{ github.event.inputs.start_year }} ${{ github.event.inputs.end_year }} --annual-only

      - name: QoQ/YoY 재계산
        run: python scripts/calculate_changes.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/financials/
          git diff --staged --quiet || git commit -m "현금흐름 백필: ${{ github.event.inputs.start_year }}-${{ github.event.inputs.end_year }}"
          git pull --rebase
          git push
