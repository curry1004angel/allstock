name: DART 주당이익 백필

on:
  workflow_dispatch:
    inputs:
      year_from:
        description: '시작 연도'
        required: true
        default: '2026'
      year_to:
        # 종목 2700여개 × 4개 기간 = 연도당 약 11000콜이고 DART 일일 한도가 20000콜이다.
        # 한 번에 1개 연도만 돌리고, 다음 연도는 하루 뒤에 실행한다.
        description: '종료 연도 (일일 한도 때문에 시작 연도와 같게 두는 것을 권장)'
        required: true
        default: '2026'
      periods:
        # 이미 찬 기간을 다시 받으면 그만큼 다른 연도를 못 받는다. 2024는 1Q와
        # 연간이 이미 차 있어 2Q,3Q만 받으면 그날 2023 한 해가 더 들어간다.
        description: '기간 (쉼표 구분: 1Q,2Q,3Q,annual). 비우면 전 기간'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 주당이익 백필
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/backfill_eps_dart.py ${{ github.event.inputs.year_from }} ${{ github.event.inputs.year_to }} "${{ github.event.inputs.periods }}"

      - name: 변화율 재계산
        run: python scripts/calculate_changes.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/financials/
          git diff --staged --quiet || git commit -m "주당이익 백필: ${{ github.event.inputs.year_from }}~${{ github.event.inputs.year_to }} ${{ github.event.inputs.periods }}"
          git pull --rebase
          git push
