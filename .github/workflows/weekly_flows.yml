name: 주간 기관 수급 수집

on:
  schedule:
    # KST 08:00 일요일 = UTC 23:00 토요일
    - cron: '0 23 * * 6'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 기관·외국인 순매수 수집
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/fetch_flows.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flows/
          git diff --staged --quiet || git commit -m "기관 수급 업데이트: $(date -u +%Y%m%d)"
          git pull --rebase
          git push
